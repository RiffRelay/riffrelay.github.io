name: Publish website

on:
  push:
    branches: [main]
  schedule:
    - cron: "21 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: RiffRelay/RiffRelayBot
          ref: main
          path: RiffRelayBot
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - run: cd RiffRelayBot && bun install --frozen-lockfile
      - run: bun run generate:commands
        env:
          RIFFRELAY_BOT_SOURCE: RiffRelayBot
      - run: bun run check:i18n
      - run: bun run typecheck
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
