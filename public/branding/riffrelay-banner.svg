<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title description">
  <title id="title">RiffRelay — Your listening history, in sync.</title>
  <desc id="description">A dark Discord-bot-inspired banner with a RiffRelay profile card and the /me command.</desc>
  <rect width="1600" height="500" fill="#1E1F22"/>
  <text x="98" y="112" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">AN INDEPENDENT DISCORD BOT</text>
  <text x="92" y="252" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="92" font-weight="700" letter-spacing="-4">RiffRelay</text>
  <text x="101" y="307" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="27">Your listening history, in sync.</text>
  <rect x="101" y="365" width="122" height="42" rx="10" fill="#313338"/>
  <text x="122" y="392" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="15">/</text>
  <text x="139" y="392" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="15" font-weight="700">me</text>
  <text x="245" y="391" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">LISTEN  ·  DISCOVER  ·  SHARE</text>
  <rect x="884" y="62" width="618" height="376" rx="18" fill="#313338" stroke="#42444B" stroke-width="2"/>
  <rect x="884" y="62" width="7" height="376" rx="3.5" fill="#5865F2"/>
  <circle cx="946" cy="125" r="31" fill="#1E1F22"/>
  <path d="M934 143V107h13c10 0 16 5 16 13 0 7-5 11-11 12l14 12m-32-12h16" fill="none" stroke="#F2F3F5" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
  <text x="993" y="121" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="19" font-weight="700">RiffRelay</text>
  <rect x="1092" y="103" width="49" height="21" rx="5" fill="#5865F2"/>
  <text x="1116.5" y="118" fill="#FFFFFF" font-family="DejaVu Sans, system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BOT</text>
  <path d="M925 177h537" stroke="#42444B" stroke-width="1"/>
  <rect x="925" y="211" width="109" height="31" rx="7" fill="#1E1F22"/>
  <text x="947" y="232" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="13">/</text>
  <text x="965" y="232" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="13" font-weight="700">me</text>
  <text x="925" y="297" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="30" font-weight="700">Your listening,</text>
  <text x="925" y="337" fill="#F2F3F5" font-family="DejaVu Sans, system-ui, sans-serif" font-size="30" font-weight="700">all in one place.</text>
  <text x="925" y="382" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="14">A little more context for every listen.</text>
  <text x="925" y="414" fill="#B5BAC1" font-family="DejaVu Sans, system-ui, sans-serif" font-size="11">LISTENBRAINZ</text>
